# ================================================================
# gti-1c-mcp — Compose (Docker / Podman)
# Запуск через Docker:  docker compose up -d
# Запуск через Podman:  podman compose up -d
#                   или podman-compose up -d
# ================================================================

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gti_1c_mcp
    restart: unless-stopped

    ports:
      - "3031:3031"

    # Все переменные берутся из .env (скопируйте из .env.example)
    env_file:
      - .env

    # Явные переменные — переопределяют значения из .env если нужно
    environment:
      MCP_PORT: "3031"
      NODE_ENV: "production"

    # Ограничения ресурсов (поддерживается Podman Compose 1.x+)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

    healthcheck:
      test: ["CMD", "node", "-e",
        "fetch('http://localhost:3031/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
